MS_PATTERN  > $(MSDIR)mdlsys/textures/		# Procedural texture dir
MS_BUMP     > $(MSDIR)mdlsys/textures/		# Procedural texture dir
MS_LIGHTING > $(_USTN_SYSTEMROOT)data/		# Default dir for IES lighting files

MS_RENDERLOG = $(MS_IMAGEOUT)render.log		# Log rendering statistics to this file

ms_cmdtable_load > mpray
ms_cmdtable_load > animator
ms_cmdtable_load > globlgt
ms_cmdtable_load > matedit
ms_cmdtable_load > rpc
ms_cmdtable_load > vfa
