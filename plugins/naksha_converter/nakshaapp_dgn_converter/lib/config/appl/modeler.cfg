#----------------------------------------------------------------------
#  define MS_MODELER
#----------------------------------------------------------------------
MS_MODELER = $(MSDIR)FeatureModeling/

#----------------------------------------------------------------------
#  to load Modeler MS_MODELER is set to Modeler base directory.
#----------------------------------------------------------------------
_USTN_FIRSTDGNAPPS > $(MS_MODELER)msmodeler.ma

#----------------------------------------------------------------------
#  set feature directories
#----------------------------------------------------------------------
MS_FEATURE < $(MS_MODELER)features/*.ma     # Modeler features file spec.

#----------------------------------------------------------------------
#  set paths to use modeler specific applications.
#----------------------------------------------------------------------
MS_MDL     < $(MS_MODELER)                  # Modeler core apps.
MS_MDL     < $(MS_MODELER)mdlapps/          # Modeler non-feature apps.
MS_MDL     < $(MS_MODELER)features/         # Modeler feature apps.

#----------------------------------------------------------------------
#  Load command tables
#----------------------------------------------------------------------
MS_CMDTABLE_LOAD > modelertools
MS_CMDTABLE_LOAD > modelervar

