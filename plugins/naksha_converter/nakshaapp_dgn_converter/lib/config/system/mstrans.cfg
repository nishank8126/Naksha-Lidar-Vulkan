#----------------------------------------------------------------------
#
# DWG/DXF configuration variables.
#
#----------------------------------------------------------------------
MS_DWGDATA              : $(_USTN_HOMEPREFS)dwgdata/	    # DWG settings
MS_DIMENSIONPROXY       : ON								# Display dimension proxies
MS_DWG_PGPFILE          : acad.pgp                          # DWG Command Aliases.
MS_DWG_COMMANDPREFIX    : "\"                               # Prefix for DWG commands.
MS_DWG_PROXYSHOW        : 1                                 # Display proxy graphics
MS_DWG_LWDEFAULT        : 0                                 # Map default lineweight to 30 mm. (unique value in LineWeight map).
                                                            # valid LWDEFAULT values are 0,5,9,13,15,18,20,25,30,35,40,50,53,60,70,90,100,106,
   															# 120,140,158,200,211.


# The following variables are optional and control various DWG Open/Save settings.
# This will include settings that are added between major releases and not yet in GUI.
#MS_DWGSAVEAPPLICATIONDATA              : 1                 # if set then application data saved to DWG.
#MS_DWG_VPORT_LAYER_FROM_CLIP           : 1					# if set then unassigned viewport layer assigned from clip entity layer.
#MS_DWG_VPORT_MAP_LOCATE_OFF_TO_LOCKED  : 1                 # if set then view port ref locate (off) mapped to the viewport display-locked.
#MS_DWG_OVERRIDE_LINETYPE_DEFS          : 1                 # if set then existing linetypes are overriden to new definitions.
#MS_DWG_CREATE_SEPERATE_SHEETS          : 1                 # if set then seperate files are created for sheet models.
#MS_DWG_DISCARD_INVALID					: 1                 # if set then invalid entities (off design plane) are discarded upon file save.
#MS_DWG_PRE2004_COLOR_TABLE             : 1                 # if set then the pre-AutoCAD colors are used for display.

# The Object Applications contain "Object Enablers" for ARX Objects
MS_DWG_OBJECT_APP       < RebisDirectApp					# Enabler for Rebis Objects.
MS_DWG_OBJECT_APP       < AdtDirectApp						# Enabler for Arch. Desktop Objects.

MS_DWG_OBJECT_DRX       < $(MSDIR)mdlsys/asneeded/

#----------------------------------------------------------------------
#
# CGM configuration variables.
#
#----------------------------------------------------------------------
%if defined (_MICROSTATION)
MS_CGMTABLES 	: $(_USTN_SYSTEMROOT)tables/cgm/    # CGM config tables.
MS_CGMINSET	: $(MS_DATA)cgmin.sfi	# CGMIN settings file.
MS_CGMOUTSET	: $(MS_DATA)cgmout.sfo	# CGMOUT settings file.
MS_CGMOUT	: $(_USTN_OUT)		# Default CGM output directory.
MS_CGMLOG	: $(MS_CGMOUT)		# CGM log files.
%endif

# MS_CGMIN should be set at a higher level - CGM input directory.

#----------------------------------------------------------------------
#
# IGES configuration variables.
#
#----------------------------------------------------------------------
%if defined (_MICROSTATION)
MS_IGESINSET	: $(MS_DATA)igesin.sfi	# IGESIN settings file.
MS_IGESOUTSET	: $(MS_DATA)igesout.sfo	# IGESOUT settings file.
MS_IGESOUT	: $(_USTN_OUT)		# Default IGES output directory.
MS_IGESLOG	: $(MS_IGESOUT)		# IGES log files.
%endif

%if defined (_MICROSTATION)
MS_STEPOUT  : $(_USTN_OUT)			    # Default STEP out directory
MS_STEPLOG  : $(MS_STEPOUT)			    # STEP Log file
MS_ROSEDB   : $(MS_DATA)/rose/database  # Directory for ap schema .rose files
%endif

# MS_IGESIN should be set at a higher level - IGES input directory.

#----------------------------------------------------------------------
#
# Default translator seed file.
#
#----------------------------------------------------------------------
MS_TRANSEED	: $(_USTN_SYSTEMROOT)seed/transeed.dgn	

