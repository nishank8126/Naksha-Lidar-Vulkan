MS_WORKMODE     : DGN               # File compatibility work mode

#----------------------------------------------------------------------
#
# Capability List - 
#   _USTN_CAPABILITY        => capabilities apply in all workmodes
#   _USTN_CAPABILITY_DGN    => capabilities apply only when in V8 workmode
#   _USTN_CAPABILITY_DWG    => capabilities apply only when in DWG workmode
#   _USTN_CAPABILITY_V7     => capabilities apply only when in V7 workmode
#
#   This configuration contains specific items to be enabled/disabled
# and each item overrides the one set by default MS_WORKMODE.
# Supported capability names are:
#
# CAPABILITY_COLORTABLE                     => attach color table
# CAPABILITY_IGDS_LINESTYLE                 => allow 1-7 IGDS linestyles
# CAPABILITY_DEFAULT_FONTS                  => allow default font.rsc
# CAPABILITY_SELF_REFERENCE                 => attach self-reference
# CAPABILITY_MASK_CLIP                      => mask clipping ref or raster file
# CAPABILITY_TYPE90_ALL                     => import all types of rasters as type 90 elements
# CAPABILITY_TYPE87_RASTER                  => create type 87/88 raster element
# CAPABILITY_TYPE2_CELL                     => create type 2 cell
# CAPABILITY_PARASOLID                      => create Parasolid element
# CAPABILITY_TAG_NOCELL_ELEMS               => attach tag element to non-cell elements
# CAPABILITY_CURVE_IN_CMPLXCH               => allow curves in complex chain/shape
# CAPABILITY_ELEMENT_CLASS                  => allow user to set element class
# CAPABILITY_DDDESIGN                       => allow demension driven design
# CAPABILITY_BYCELL                         => allows the use of ByCell for elements
# CAPABILITY_BYLEVEL                        => allows the use of ByLevel for elements 
# CAPABILITY_SCALE_AXIS_INDEP               => allow independant modification of the scaling
# CAPABILITY_REF_SCALELINESTYLE             => Allow linestyle to be scaled when attaching a reference file
# CAPABILITY_REF_AUX_INFO                   => allow logical name and description for a reference attachment
# CAPABILITY_REF_FROM_URL                   => allow reference attachment from URL
# CAPABILITY_REF_DISP_PER_VIEW              => allow display control on a per view basis
# CAPABILITY_REF_SAVE_PATH_REL              => allow relative path for referemce attachments
# CAPABILITY_REF_NONDEFAULT_MODEL           => ability to attach a model other than the default model as a reference
# CAPABILITY_REF_NESTING_OPTIONS            => ability to turn nesting off for a reference
# CAPABILITY_REF_RASTERDISPLAY_OFF          => ability to turn off reference attachments raster reference display
# CAPABILITY_REF_ADJUSTCOLORS               => ability to adjust reference colors 
# CAPABILITY_NAMED_GROUPS                   => ability to create and use named groups
# CAPABILITY_TABLE_DESCRIPTION              => Allow creation of description for ref or dimstyle etc
# CAPABILITY_RASTER_TINT                    => Allow tint on raster
# CAPABILITY_RASTER_TRANSP_FULL_CONTROL     => Allow full control on image transparency 
# CAPABILITY_RASTER_BACKGROUND              => Allow background color on raster 
# CAPABILITY_RASTER_PROJECT                 => Allow work with raster projects 
# CAPABILITY_RASTER_DISP_GAMMA              => Allow display gamma on raster
# CAPABILITY_RASTER_PRINT_GAMMA             => Allow plot gamma on raster
# CAPABILITY_RASTER_PRINT                   => Allow plot control on raster
# CAPABILITY_RASTER_ALL_TYPES               => Allow opening of all supported raster types
# CAPABILITY_RASTER_INVERT                   => Allow turning on/off raster invert toggle
# CAPABILITY_RASTER_APPLYROTATIONANDAFFINITY => Allow turning on/off raster apply rotation and affinity toggle 
# CAPABILITY_RASTER_GEOREFERENCEPRIORITY     => Allow changing raster georeference priority setting 
