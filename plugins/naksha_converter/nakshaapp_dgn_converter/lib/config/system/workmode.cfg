# CAPABILITY_DIMENSION_NEG_EXTOFFSET        => Allow negative value for extension line offset
# CAPABILITY_DIMENSION_SCALEFROMMODEL       => Allow use of dimension geometrical scale per model
# CAPABILITY_DIMENSION_TERM_SIDES           => Allow terminator to be inside/outside/reversed
# CAPABILITY_DIMSTYLE_REQUIRESTANDARD       => Can not delete STANDARD or the last named style
# CAPABILITY_NOTE_VERTICAL_LINE             => Allow note to have the vertical line along side of the text
# CAPABILITY_NOTE_ELBOWLENGTH               => Allow setting of elbow/hook line length for note
# CAPABILITY_NOTE_LEFTMARGIN                => Allow setting of left text margin
# CAPABILITY_NOTE_LOWERMARGIN               => Allow setting of lower text margin
# CAPABILITY_NOTE_MANUALATTACHMENT          => Allow note leader attached to the left or right side of text
# CAPABILITY_GRID_ORIENTATION               => select grid orientation to display
# CAPABILITY_INVISGEOM_BYELEMENT            => Allow control of invisible geometry display at element level
# CAPABILITY_BSPLINE_DISPLAY_CONTROL        => Allow per-element control of B-spline curve/surface/polygon display
# CAPABILITY_MODEL_CREATE_DESIGN            => Allow the creation of new design models
# CAPABILITY_MODEL_CREATE_SHEET             => Allow the creation of new sheet models
# CAPABILITY_MODEL_WITHOUT_VIEWGROUP        => Allow model to be created without also creating a viewgroup
# CAPABILITY_MODEL_CREATE_2D                => Allow the creation of 2D models
# CAPABILITY_MODEL_CREATE_3D                => Allow the creation of 3D models
# CAPABILITY_MODEL_CHANGE_TYPE              => Allow the type of existing models to be changed
# CAPABILITY_MODEL_DELETE_DESIGN            => Allow design models to be deleted
# CAPABILITY_MODEL_DELETE_SHEET             => Allow sheet models to be deleted
# CAPABILITY_MODEL_DELETE_LAST_DESIGN       => Allow the last design model to be deleted (unless it is the default)
# CAPABILITY_MODEL_DELETE_LAST_SHEET        => Allow the last sheet model to be deleted (unless it is the default)
# CAPABILITY_MODEL_EDIT_PROPERTIES_DESIGN   => Allow name/description of design models to be changed
# CAPABILITY_MODEL_EDIT_PROPERTIES_SHEET    => Allow name/description of sheet models to be changed
# CAPABILITY_MODEL_ANNOTATION_SCALE         => Allow use of lock toggle to use or not use annotation scale
# CAPABILITY_VIEWGROUP_CREATION             => Allow the creation of view groups outside of model creation process
# CAPABILITY_VIEWGROUP_DELETION             => Allow the deletion of view groups outside of model deletion process
# CAPABILITY_VIEWGROUP_UPDATE               => Allow the update of view group properties
# CAPABILITY_VIEW_ROTATE_SHEET_MODEL_VIEW   => Allow rotate of sheet model views
# CAPABILITY_SAVEDVIEWS_CREATE_FOR_SHEETS   => Allow saved view creation for sheet models
# CAPABILITY_SAVEDVIEWS_APPLY_TO_SHEETS     => Allow saved view apply for sheet models
# CAPABILITY_SAVEDVIEWS_DELETE_FOR_SHEETS   => Allow saved view delete for sheet models
# CAPABILITY_SAVEDVIEWS_PROPS_FOR_SHEETS    => Allow saved view property edits for sheet models
# CAPABILITY_SAVEDVIEWS_UPDATE_FOR_SHEETS   => Allow saved view setting updates for sheet models
# CAPABILITY_CELLS_ATTRIBUTE_CHANGES        => Allows changes to sub-components attributes 
# CAPABILITY_VIEWATTRIBUTES                 => Allows changes to all view attributes in DWG file
# CAPABILITY_REFERENCE_3DTO2D               => Allow 3d reference to 2d files 
# CAPABILITY_REFERENCE_V8                   => Use V8 type reference information
# CAPABILITY_REFERENCE_DWG                  => Allow DWG reference attachments
# CAPABILITY_REFERENCE_ATTACHLEVEL          => Allow reference attachments to be assigned to a level.
# CAPABILITY_REFERENCE_VIEWLEVELDISPLAY     => Allow turning off display of reference attached by level by turning off the level 
# CAPABILITY_TAGS_COPY_WITH_BASE            => Allow copying of tag information with base element
# CAPABILITY_LEVEL_PLOT                     => plot control levels.  GUI adds Plot in the columns for Levels in Level Manager
# CAPABILITY_LEVELS_CREATE                  => Allow the creation/deletion of levels
# CAPABILITY_LEVELS_ALLOW_DELETE            => Allow the deletion of levels; this applies only if CAPABILITY_LEVELS_CREATE is not disabled
# CAPABILITY_LEVELS_ALLOW_CREATE            => Allow the creation of levels; this applies only if CAPABILITY_LEVELS_CREATE is not disabled
# CAPABILITY_LEVEL_LIBRARY_ATTACH           => Allow level library attach from Level manager dialog
# CAPABILITY_LEVEL_LIBRARY_DETACH           => Allow level library detach from Level manager dialog
# CAPABILITY_LEVELS_VPFREEZE                => Allows access to Viewport Freeze settings in DGN workmode if applicable
# CAPABILITY_LEVELS_OVERRIDE_SYMBOLOGY      => Allows setting the symbology overrides on the Level Manager
# CAPABILITY_LEVELS_OVERRIDES_PER_LEVEL     => Allows setting the symbology overrides on a per-level basis
# CAPABILITY_LEVELS_GLOBALDISPLAY           => Allow turning off/on levels using global display
# CAPABILITY_LEVELS_GLOBALFREEZE            => Allow turning off/on levels using global freeze
# CAPABILITY_LEVELS_NUMBERS                 => Allow level numbers.  This includes the interface and keyins
# CAPABILITY_LEVELS_DESCRIPTION             => Allow level description.  This includes the interface and keyins
# CAPABILITY_SHAREDCELLS_FROM_ATTACHED_LIB  => Allow shared cells to be placed from attached cell library
# CAPABILITY_SHAREDCELLS_FROM_REFERENCES    => Allow shared cells to be placed from references
# CAPABILITY_TEXTSTYLE_ACTIVE_DGNSETTINGS   => Allow the text style editor to show the active settings used by V8 dgn files
# CAPABILITY_TEXTSTYLE_ACTIVE_DWGSETTINGS   => Allow the text style editor to show only the active settings used by dwg files
# CAPABILITY_TEXTSTYLE_STYLE_DGNSETTINGS    => Allow the text style editor to show the style settings used by V8 dgn files
# CAPABILITY_TEXTSTYLE_STYLE_DWGSETTINGS    => Allow the text style editor to show the style settings used by dwg styles
# CAPABILITY_CELLPATTERN                    => use ms cell pattern or acad named pattern
# CAPABILITY_MULTILINE_NOSTYLE              => use Style (none) as active multi-line style
# CAPABILITY_MULTILINE_REQUIRESTANDARDSTYLE => STANDARD can be renamed but not deleted
# CAPABILITY_MULTILINE_ALLOW_ACTIVE         => Allow (active) settings in multi-line styles.
# CAPABILITY_CELLLIB_ALLOWUPGRADEV7         => Allow V8 to upgrade V7 cell libraries; on by default.
#
# Use a + prefix to add a capability, and - prefix to remove it.
#
# For example:
#
# _USTN_CAPABILITY < -CAPABILITY_COLORTABLE
# _USTN_CAPABILITY < +CAPABILITY_PARASOLID
#
# will disable color tables and enable parasolid in any workmode. 
#
# This also works in workmode dependent capabilities.  For example:
#
# _USTN_CAPABILITY_DWG < +CAPABILITY_PARASOLID
#
# will enable parasolid in DWG workmode. Keep in mind that a workmode
# dependent capability is only meant to override the default capability
# in that workmode. It does affect other workmodes in any way.
#
#
# NOTE: Only use '<' or '>' to append or prepend capability masks that
#       you wish to use. Using '=' after the initial definition below 
#       will override any previous definition, which may result in 
#       undesirable or unpredictable behavior.
#
#----------------------------------------------------------------------
# Adjustments to DGN workmode are defined here
# The capability for custom units is enabled. Note that a scale factor may be added to a DWG dimension.

_USTN_CAPABILITY = +CAPABILITY_DIMENSION_CUSTOM_UNITS

# Adjustments to DWG workmode are defined here
# The capability for creating patterns from cells is enabled as DWG Hatches are extracted directly from cell patterns in 8.1.1.

_USTN_CAPABILITY_DWG < +CAPABILITY_CELLPATTERN
