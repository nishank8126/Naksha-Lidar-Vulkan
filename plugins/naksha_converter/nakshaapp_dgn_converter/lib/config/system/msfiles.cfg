    %else
      MS_USERLICENSE            : $(MSLOCAL)license/msdraft.lic
    %endif
%elif defined (_BENTLEYREDLINE)
    %if defined (_VERSION80)
      MS_USERLICENSE            : $(_USTN_LICENSING)BentleyRdl.lic
      MS_OLDUSERLICENSE         : $(_USTN_LICENSING)scope70.lic
    %elif defined (_VERSION70)
      MS_USERLICENSE            : $(_USTN_LICENSING)scope70.lic
      MS_OLDUSERLICENSE         : $(_USTN_LICENSING)pwrscope.lic
    %else
      MS_USERLICENSE            : $(MSLOCAL)license/pwrscope.lic
    %endif
%elif defined (_MSGEOOUTLOOK)
    %if defined (_VERSION70)
      MS_USERLICENSE            : $(_USTN_LICENSING)geoolk70.lic
      MS_OLDUSERLICENSE         : $(_USTN_LICENSING)geooutlk.lic
    %else
      MS_USERLICENSE            : $(MSLOCAL)license/geooutlk.lic
    %endif
%elif defined (_BENTLEYVIEW)
      MS_USERLICENSE            : $(_USTN_LICENSING)BentleyView.lic
%else
    %if defined (_VERSION80)
      MS_USERLICENSE            : $(_USTN_LICENSING)msv8.lic
      MS_OLDUSERLICENSE         : $(_USTN_LICENSING)msj.lic
    %elif defined (_VERSION70)
      MS_OLDUSERLICENSE         : $(_USTN_LICENSING)ustation.lic
      MS_USERLICENSE            : $(_USTN_LICENSING)msj.lic
    %elif defined (_VERSION57)
      MS_OLDUSERLICENSE         : $(MSLOCAL)license/ms95.lic
      MS_USERLICENSE            : $(MSLOCAL)license/ustation.lic
    %elif defined (_VERSION55)
      MS_OLDUSERLICENSE         : $(MSLOCAL)license/ms50.lic
      MS_USERLICENSE            : $(MSLOCAL)license/ms95.lic
    %else
      MS_USERLICENSE            : $(MSLOCAL)license/ms50.lic
    %endif
%endif

