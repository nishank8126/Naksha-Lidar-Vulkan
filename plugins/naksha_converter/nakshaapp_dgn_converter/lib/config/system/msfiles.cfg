#----------------------------------------------------------------------
#
# Main MicroStation Resource File
#
#----------------------------------------------------------------------
%if   defined (_MSREVIEW)
 MS_RSRC                        : $(MSDIR)msreview.rsc          # Review resource file
%elif defined (_PRJREVIEW)
 MS_RSRC                        : $(MSDIR)prjreview.rsc         # Project Review resource file
%elif defined (_MSDRAFT)
 MS_RSRC                        : $(MSDIR)msdraft.rsc           # Draft resource file
%elif defined (_BENTLEYREDLINE)
 MS_RSRC                        : $(MSDIR)BentleyRdl.rsc        # ViewRDL resource file
%elif defined (_BENTLEYVIEW)
 MS_RSRC                        : $(MSDIR)BentleyView.rsc       # View resource file
%elif defined (_MSGEOOUTLOOK)
 MS_RSRC                        : $(MSDIR)geooutlk.rsc          # GeoOutlook resource file
%else
 MS_RSRC                        : $(MSDIR)ustation.rsc          # MicroStation resource file
%endif

#----------------------------------------------------------------------
#
# Macros that define FILES needed by MicroStation.
#
#----------------------------------------------------------------------
MS_DESIGNSEED                   : seed2d.dgn                                # Default dgn seed file.
MS_DWGSEED                      : $(_USTN_SYSTEMROOT)seed/seed.dwg

MS_CODESET                      =                                           # Codeset file.
MS_DEFCHARTRAN                  : 0                                         # Default char translation table.

MS_FKEYMNU                      : $(_USTN_USERINTROOT)fkeys/funckey.mnu     # Function key menu
MS_SAVEMENU                     : $(MS_DATA)attached.men                    # Attached Menus
MS_ACCUDRAWKEYS                 : $(MS_DATA)shortcut.txt                    # AccuDraw shortcuts

%if defined (_BENTLEYVIEW) || defined (_BENTLEYREDLINE)
 MS_PLTR                        : $(_USTN_SYSTEMROOT)plotdrv/printer.plt    # Default plotter config file.
%elif defined (_winNT) && !defined (_MSENGINE)
 MS_PLTR                        : $(_USTN_SYSTEMROOT)plotdrv/printer.plt    # Default plotter config file.
%else
 MS_PLTR                        : $(_USTN_SYSTEMROOT)plotdrv/pscript.plt    # Default plotter config file.
%endif

MS_BATCHPLT_SPECS               : $(MS_DATA)batchplt.spc                    # Batch plotting specification file.

%if defined (_MSREVIEW)
 MS_SETTINGS                    : $(MS_DATA)review.stg                      # Settings resource.
%else
 MS_SETTINGS                    : $(MS_DATA)styles.stg                      # Settings resource.
%endif

%if defined (_MSDRAFT) || defined (_PRJREVIEW)
MS_MENU                         : $(_USTN_SYSTEMROOT)menus/cell/mspdmenu.cel    # Cell lib for menus.
%elif defined (_BENTLEYREDLINE)
MS_MENU                         : $(_USTN_SYSTEMROOT)menus/cell/psmenu.cel      # Cell lib for menus.
%elif defined (_viecon_review)                                                  # none
%else
MS_MENU                         : $(_USTN_SYSTEMROOT)menus/cell/msmenu.cel      # Cell lib for menus.
%endif

%if defined (_MSREVIEW) || defined (_BENTLEYREDLINE) || defined (_MSGEOOUTLOOK)
MS_CELLLIST                     : $(_USTN_SYSTEMROOT)cell/*.cel             # hook up cell libs
%endif

MS_LIGHTLIST : $(_USTN_SYSTEMROOT)cell/lightlist.dgn;$(_USTN_SITE)cell/lightlist.dgn;$(_USTN_PROJECTDATA)cell/lightlist.dgn

