    %if defined (_VERSION80)
      MS_USERLICENSE            : $(_USTN_LICENSING)draftv8.lic
      MS_OLDUSERLICENSE         : $(_USTN_LICENSING)draft70.lic
    %elif defined (_VERSION70)
      MS_USERLICENSE            : $(_USTN_LICENSING)draft70.lic
